let answers=Array(40).fill(null),index=0,mode='';const $=s=>document.querySelector(s);const home=$('#home'),quiz=$('#quiz'),result=$('#result');
function showQuestion(){const [title,opts]=prompts[index];$('#counter').textContent=String(index+1).padStart(2,'0')+' / 40';$('#progress').style.width=((index+1)/40*100)+'%';$('#back').style.visibility=index===0?'hidden':'visible';$('#qbody').innerHTML=`<div class="fade"><div class="qtag">QUESTION ${String(index+1).padStart(2,'0')}</div><h2 class="question">${title}</h2><div class="answers">${opts.map((o,i)=>`<button class="answer" data-i="${i}"><span class="letter">0${i+1}</span><span class="answer-text">${o}</span></button>`).join('')}</div></div>`;document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{answers[index]=+b.dataset.i;if(index<39){index++;showQuestion()}else showResult()})}
function vector(){let s={nature:0,pace:0,social:0,career:0,culture:0};answers.forEach((a,q)=>{let d=dimensions[(q+Math.floor(q/5))%dimensions.length];let value=[-1,0,1,2][a];s[d]+=value;let d2=dimensions[(dimensions.indexOf(d)+2)%5];s[d2]+=[1,0,-1,0][a]*.45});return s}
function recommend(which){let v=vector(),list=which==='国内'?cities.slice(0,6):cities.slice(6);return list.map(c=>({c,score:Object.keys(v).reduce((n,k)=>n+v[k]*c.scores[k],0)})).sort((a,b)=>b.score-a.score)[0].c}
function showResult(){mode='双城';let a=recommend('国内'),b=recommend('国际');home.classList.add('hidden');quiz.classList.add('hidden');result.classList.remove('hidden');result.innerHTML=`<div class="eyebrow">YOUR CITY, YOUR RHYTHM</div><h1 style="font-family:'Noto Serif SC';font-size:clamp(30px,5vw,48px);margin:12px 0 26px">你的生活坐标，已经找到。</h1>${card(a,'国内匹配')}<div style="height:22px"></div>${card(b,'国际匹配')}<div class="actions"><button class="cta" id="again">重新测试　↺</button><button class="secondary" id="share">复制结果文案</button></div><p class="fineprint">这是基于生活偏好的趣味匹配，不代表真实迁居建议，也不涉及八字或心理诊断。城市评分由你的答案与生活维度偏好计算得出。</p>`;$('#again').onclick=restart;$('#share').onclick=share;window.scrollTo({top:0,behavior:'smooth'})}
function card(c,label){return `<article class="result-card fade"><div class="result-art"><div class="sun"></div><div class="hill"></div><div class="path"></div><div class="hill two"></div></div><div class="result-copy"><div class="country">${label}　/　${c.country}</div><h2>${c.name}</h2><div class="tags"><span class="tag">${c.style}</span>${c.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><p class="motto">「${c.motto}」</p><p class="intro" style="font-size:13px;margin:0">${c.reason}</p></div></article><div class="details"><div class="detail"><h3>匹配理由</h3><p>${c.reason}</p></div><div class="detail"><h3>你的隐藏优势</h3><p>${c.adv}</p></div><div class="detail"><h3>城市彩蛋</h3><p>${c.easter}</p></div></div>`}
function restart(){answers=Array(40).fill(null);index=0;result.classList.add('hidden');home.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}function share(){let names=[...result.querySelectorAll('.result-copy h2')].map(x=>x.textContent);let txt=`我的生活坐标：${names.join(' × ')}！「${names[0]}：${cities.find(c=>c.name===names[0]).motto}」来测测你最适合在哪个城市定居。`;navigator.clipboard?.writeText(txt).then(()=>alert('结果文案已复制，分享给朋友吧！')).catch(()=>alert(txt))}
$('#start').onclick=()=>{home.classList.add('hidden');quiz.classList.remove('hidden');index=0;showQuestion();window.scrollTo({top:0,behavior:'smooth'})};$('#back').onclick=()=>{if(index>0){index--;showQuestion()}};
</script></body></html>
